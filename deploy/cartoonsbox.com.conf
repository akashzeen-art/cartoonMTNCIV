# HTTP — redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cartoonsbox.com www.cartoonsbox.com;

    location /.well-known/acme-challenge/ {
        root /var/www/vasnumero/cartoon_MTN_CLI/dist;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Cartoon Box site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cartoonsbox.com www.cartoonsbox.com;

    ssl_certificate     /etc/letsencrypt/live/cartoonsbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartoonsbox.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/vasnumero/cartoon_MTN_CLI/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    location /adpoke/ {
        proxy_pass http://68.183.88.91;
        proxy_http_version 1.1;
        proxy_set_header Host 68.183.88.91;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/cartoonsbox.com.access.log;
    error_log  /var/log/nginx/cartoonsbox.com.error.log;
}
